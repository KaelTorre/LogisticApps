name: sistema_red_distribucion
description: "Sistema de optimizacion de red de distribucion - Unidad 5, curso de Logistica."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.1+2

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Motor geográfico compartido (ruteo OSRM, geo_utils, selector de mapa) —
  # extraído de sistema-optimizacion-rutas, ver CLAUDE.md sección 5.
  paquete_geo_logistica:
    path: paquete_geo_logistica

  # Estado de la app (proyecto activo, escenario en edición, progreso de
  # construcción de la matriz).
  provider: ^6.1.5+1

  # Base local SQLite con esquema tipado y migraciones (las 15 tablas de
  # CLAUDE.md sección 6). Sin backend: todo el proyecto vive en este archivo.
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.6
  path: ^1.9.1

  # Mapa base (zonas, candidatos, territorios) y cliente HTTP/hash que ya
  # exige paquete_geo_logistica como dependencias directas del cliente OSRM.
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  http: ^1.6.0
  crypto: ^3.0.7

  # Curva de costo total y gráficas de barras apiladas por rubro.
  fl_chart: ^1.1.1

  # Ficha técnica exportable en PDF (reutiliza el patrón de pdf_builder.dart
  # de sistema-diseno-almacenes).
  pdf: ^3.11.3
  printing: ^5.14.2

  # Capa visual: misma identidad que sistema-optimizacion-rutas y
  # sistema-diseno-almacenes, para no fragmentar el lenguaje visual del
  # repositorio entre proyectos hermanos.
  flex_color_scheme: ^8.4.0
  google_fonts: ^8.1.0
  lucide_icons_flutter: ^3.1.14+2
  flutter_animate: ^4.5.2

  # Abrir la carpeta de exportados / compartir el archivo exportado —
  # mismo patrón multiplataforma que sistema-diseno-almacenes
  # (abrir_carpeta.dart): share_plus para el share sheet nativo de Android,
  # url_launcher para abrir el enlace del visor web, android_intent_plus
  # para abrir el archivo exportado con la app que corresponda en Android.
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  android_intent_plus: ^6.1.0

  # Recordar si la inducción guiada ya se mostró (Fase 9) — una sola bandera
  # booleana persistida entre arranques; mismo paquete que ya usa
  # sistema-diseno-almacenes para lo mismo.
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.1+1
  build_runner: ^2.15.0
  sqlite3: ^3.3.4

  # Fase 9: ícono propio (assets/icon/icon.svg rasterizado a PNG),
  # reutilizado para Android (con capa adaptativa), Windows y el AppImage de
  # Linux (tool/appimage/). Corrido a mano una vez con `dart run
  # flutter_launcher_icons`; no se re-ejecuta automáticamente en cada build.
  flutter_launcher_icons: ^0.14.4

# Mismo azul que FlexScheme.shadBlue (lib/core/theme.dart, #2563EB) — no se
# fragmenta la identidad visual entre el tema de la app y su propio ícono.
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # DejaVu Sans (assets/fonts/): tildes/ñ y símbolos matemáticos en el PDF
  # de exportación — la Helvetica base del paquete `pdf` no los dibuja. Ver
  # assets/CREDITS.md para la licencia.
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
    # Caso de estudio precargado (Fase 9): proyecto completo de Pucallpa,
    # con la matriz de distancias ya calculada con OSRM real — generado una
    # sola vez por tool/generar_semilla_pucallpa.dart, nunca en el arranque
    # real de la app (ver lib/data/seed/sembrar_caso_estudio.dart).
    - assets/seed/semilla_pucallpa.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
