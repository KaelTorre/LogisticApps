name: paquete_geo_logistica
description: >-
  Motor geográfico compartido (ruteo OSRM con caché, utilidades de distancia,
  selector de ubicación) entre las apps de Logística del repositorio.
version: 0.0.1
publish_to: 'none'
homepage:

environment:
  sdk: ^3.13.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # Cliente HTTP del cliente OSRM.
  http: ^1.6.0
  # Hash de consultas para la clave de caché (sección 5.2 del CLAUDE.md de
  # sistema-red-distribucion).
  crypto: ^3.0.7
  # Tipo de coordenada (LatLng) que usan geo_utils y SelectorUbicacionScreen.
  latlong2: ^0.10.1
  # Mapa base del selector de ubicación.
  flutter_map: ^8.3.1
  # Íconos del selector de ubicación (mismo lenguaje visual que las apps
  # consumidoras).
  lucide_icons_flutter: ^3.1.14+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

